[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"
static_cell = "2.1.1"
portable-atomic = {version = "1.15.0", features = ["critical-section"] }
